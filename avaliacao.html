<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Elias Silva Pinto">
  <meta name="description" content="Confirmação da avaliação de produto e contador de avaliações concluídas.">
  <title>Confirmação da avaliação | Elias Silva Pinto</title>
  <link rel="stylesheet" href="estilos/formulario.css">
  <script src="scripts/formulario.js" defer></script>
</head>
<body>
  <header><p class="eyebrow">Sua experiência importa</p><h1>Confirmação da avaliação</h1></header>
  <main class="confirmation">
    <h2 id="confirmation-title">Verificando avaliação…</h2>
    <p id="confirmation-message" role="status"></p>
    <p id="review-summary"></p>
    <p class="counter">Avaliações concluídas neste navegador: <strong id="review-count">0</strong></p>
    <p id="storage-message" class="hint"></p>
    <a class="button" href="formulario.html">Fazer uma avaliação</a>
    <noscript>Ative o JavaScript para visualizar a confirmação e o contador.</noscript>
  </main>
  <footer>
    <p>© <span id="currentyear"></span> • Elias Silva Pinto • Brasil</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
